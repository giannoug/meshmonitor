name: Workspace E2E

# Board screenshots for the Workspace layout (tests/workspace-e2e). Runs the
# built app against the Athens fixtures with no backend. Not a required check.

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boards:
    name: Workspace boards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build and screenshot boards
        run: npm run test:workspace-e2e

      - name: Upload board screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: workspace-boards
          path: test-results/workspace-boards
          if-no-files-found: ignore
